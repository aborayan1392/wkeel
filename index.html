<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta name="x-poe-datastore-behavior" content="local_only">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f2557">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="وكيل المدرسة">
<title>نظام إدارة وكيل المدرسة المطور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#0f2557;--primary-light:#1e3a6e;--primary-dark:#091738;--accent:#c9a227;--accent-light:#e0bd4e;--surface:#ffffff;--surface2:#f4f6f9;--surface3:#e8ecf1;--bg:#eef1f6;--text:#1a1d2e;--text2:#4a5068;--text3:#7a8098;--border:#d0d5e0;--success:#1a7f37;--warning:#d4a017;--danger:#c41e3a;--danger-light:#fce8ec;--radius:10px;--shadow:0 2px 12px rgba(15,37,87,.08);--shadow-lg:0 8px 32px rgba(15,37,87,.12);--font:'Cairo',Tahoma,sans-serif;--sidebar-w:260px;--header-h:60px}
.dark{--primary:#1e3a6e;--primary-light:#2a4f8a;--primary-dark:#0f2557;--accent:#e0bd4e;--accent-light:#f0d56e;--surface:#161b22;--surface2:#1c2333;--surface3:#242d3d;--bg:#0d1117;--text:#c9d1d9;--text2:#8b949e;--text3:#6e7681;--border:#30363d;--danger-light:#3d1f28;--shadow:0 2px 12px rgba(0,0,0,.3);--shadow-lg:0 8px 32px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface2)}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:3px}
a{color:var(--accent);text-decoration:none}
input,select,textarea,button{font-family:var(--font);font-size:14px}
button{cursor:pointer;border:none;outline:none}
input,select,textarea{background:var(--surface);color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius);padding:10px 14px;width:100%;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
textarea{resize:vertical;min-height:80px}
/* LOGIN */
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 50%,var(--primary-light) 100%);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--surface);border-radius:16px;padding:40px 36px;width:90%;max-width:400px;box-shadow:var(--shadow-lg);text-align:center;animation:fadeUp .5s ease}
.login-box .logo-icon{width:80px;height:80px;margin:0 auto 16px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center}
.login-box .logo-icon svg{width:44px;height:44px;fill:var(--accent)}
.login-box h1{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:6px}
.login-box p{color:var(--text2);font-size:13px;margin-bottom:24px}
.login-box .field{margin-bottom:16px;text-align:right}
.login-box label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.login-box .btn-login{width:100%;padding:12px;background:var(--primary);color:#fff;border-radius:var(--radius);font-size:16px;font-weight:600;transition:.2s}
.login-box .btn-login:hover{background:var(--primary-light)}
.login-box .err{color:var(--danger);font-size:12px;margin-top:8px;display:none}
/* LAYOUT */
#app{display:none}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100}
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;background:var(--primary-dark);color:#fff;z-index:101;display:flex;flex-direction:column;transition:transform .3s ease;overflow-y:auto}
.sidebar .brand{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar .brand-logo{width:56px;height:56px;margin:0 auto 8px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--primary-dark)}
.sidebar .brand h2{font-size:15px;font-weight:600}
.sidebar .brand small{font-size:11px;opacity:.6}
.sidebar nav{flex:1;padding:12px 0}
.sidebar nav .nav-header {padding: 18px 24px 8px; font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 700; letter-spacing: .5px;}
.sidebar nav a{display:flex;align-items:center;gap:12px;margin:6px 16px;padding:10px 16px;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;border-radius:12px;transition:all .3s ease;border:1px solid transparent;background:transparent}
.sidebar nav a:hover{background:rgba(255,255,255,.05);color:#fff;border-color:rgba(255,255,255,.1);transform:translateY(-1px)}
.sidebar nav a.active{background:linear-gradient(90deg,var(--accent) 0%,var(--accent-light) 100%);color:var(--primary-dark);box-shadow:0 4px 15px rgba(201,162,39,.3);border-color:transparent}
.sidebar nav a svg{width:18px;height:18px;flex-shrink:0;fill:currentColor;transition:.3s}
.sidebar .sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}
.sidebar .sidebar-footer button{width:100%;padding:10px;background:rgba(255,255,255,.08);color:#fff;border-radius:var(--radius);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.sidebar .sidebar-footer button:hover{background:rgba(255,255,255,.15)}
.main{margin-right:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:50}
.header .menu-btn{display:none;background:none;font-size:22px;color:var(--text)}
.header .header-title{font-size:17px;font-weight:600}
.header .header-date{margin-right:auto;font-size:12px;color:var(--text3)}
.content{flex:1;padding:24px}
.section{display:none}
.section.active{display:block}
/* CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;border-top:3px solid var(--primary)}
.stat-card .sc-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:20px}
.stat-card .sc-val{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .sc-label{font-size:12px;color:var(--text2);margin-top:2px}
.stat-card:nth-child(1){border-top-color:var(--primary)} .stat-card:nth-child(1) .sc-icon{background:rgba(15,37,87,.1);color:var(--primary)}
.stat-card:nth-child(2){border-top-color:var(--danger)} .stat-card:nth-child(2) .sc-icon{background:rgba(196,30,58,.1);color:var(--danger)}
.stat-card:nth-child(3){border-top-color:var(--warning)} .stat-card:nth-child(3) .sc-icon{background:rgba(212,160,23,.1);color:var(--warning)}
.stat-card:nth-child(4){border-top-color:var(--success)} .stat-card:nth-child(4) .sc-icon{background:rgba(26,127,55,.1);color:var(--success)}
.stat-card:nth-child(5){border-top-color:#7c3aed} .stat-card:nth-child(5) .sc-icon{background:rgba(124,58,237,.1);color:#7c3aed}
.chart-area{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:24px}
.chart-area h3{font-size:15px;margin-bottom:16px;font-weight:600}
.chart-area canvas{width:100%!important;max-height:260px}
/* TABLE */
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px}
.panel-header{padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.panel-header h3{font-size:15px;font-weight:600;white-space:nowrap}
.panel-header .spacer{flex:1}
.search-input{width:220px;padding:8px 12px;font-size:13px}
.filter-select{width:140px;padding:8px 12px;font-size:13px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 14px;text-align:right;white-space:nowrap}
th{background:var(--surface2);font-weight:600;color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
tr{border-bottom:1px solid var(--border);transition:.15s}
tbody tr:hover{background:var(--surface2)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-success{background:rgba(26,127,55,.1);color:var(--success)}
.badge-warning{background:rgba(212,160,23,.1);color:var(--warning)}
.badge-primary{background:rgba(15,37,87,.1);color:var(--primary)}
.badge-info{background:rgba(124,58,237,.1);color:#7c3aed}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff} .btn-primary:hover{background:var(--primary-light)}
.btn-accent{background:var(--accent);color:var(--primary-dark)} .btn-accent:hover{background:var(--accent-light)}
.btn-danger{background:var(--danger);color:#fff} .btn-danger:hover{opacity:.85}
.btn-success{background:var(--success);color:#fff} .btn-success:hover{opacity:.85}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)} .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:var(--surface2);color:var(--text2);transition:.2s}
.btn-icon:hover{background:var(--surface3);color:var(--text)}
.actions{display:flex;gap:4px}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:fadeUp .25s ease}
.modal-lg{max-width:800px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:16px;font-weight:600}
.modal-close{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text2);font-size:18px;cursor:pointer;transition:.15s}
.modal-close:hover{background:var(--surface3)}
.modal-body{padding:22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-start;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;font-weight:600;color:var(--text2)}
.form-group.full{grid-column:1/-1}
/* TOAST & CONFIRM */
.toast-container{position:fixed;top:20px;left:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);color:#fff;font-size:13px;font-weight:500;animation:slideIn .3s ease;box-shadow:var(--shadow-lg);max-width:320px}
.toast-success{background:var(--success)} .toast-danger{background:var(--danger)} .toast-warning{background:var(--warning);color:var(--primary-dark)}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--surface);border-radius:14px;padding:28px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:fadeUp .2s ease}
.confirm-box p{margin-bottom:20px;font-size:14px;line-height:1.7}
.confirm-box .btns{display:flex;gap:10px;justify-content:center}
/* ALERTS & AI INSIGHTS */
.alert-box{background:var(--danger-light);border-right:4px solid var(--danger);padding:12px 16px;border-radius:var(--radius);margin-bottom:12px;display:flex;align-items:center;gap:12px}
.alert-box.warn{background:rgba(212,160,23,.1);border-right-color:var(--warning)}
.alert-box.info{background:rgba(124,58,237,.1);border-right-color:#7c3aed}
.alert-box p{font-size:13px;color:var(--text);margin:0}
/* PROFILE */
.profile-header{display:flex;gap:24px;align-items:flex-start;background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px;flex-wrap:wrap;position:relative}
.profile-photo{width:100px;height:100px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:3px solid var(--accent)}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:200px}
.profile-info h2{font-size:20px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.profile-info .meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px;font-size:12px;color:var(--text2)}
.profile-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px;background:var(--surface);border-radius:var(--radius);padding:6px;box-shadow:var(--shadow)}
.profile-tabs button{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;background:transparent;color:var(--text2);transition:.2s}
.profile-tabs button.active{background:var(--primary);color:#fff}
.profile-tabs button:hover:not(.active){background:var(--surface2)}
.profile-section{display:none} .profile-section.active{display:block}
.empty-state{text-align:center;padding:40px;color:var(--text3)}
.empty-state .em-icon{font-size:48px;margin-bottom:12px}
/* RESPONSIVE & ANIMATIONS */
@media(max-width:768px){
.sidebar{transform:translateX(100%)} .sidebar.open{transform:translateX(0)} .sidebar-overlay.show{display:block}
.main{margin-right:0} .header .menu-btn{display:flex} .content{padding:16px}
.stat-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.form-grid{grid-template-columns:1fr} .panel-header{flex-direction:column;align-items:stretch}
.search-input,.filter-select{width:100%} .profile-header{flex-direction:column;align-items:center;text-align:center}
.profile-info .meta{justify-content:center}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .4s ease}
</style>
</head>
<body>

<div id="loginScreen">
<div class="login-box">
<div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"></path></svg></div>
<h1>المساعد لوكيل المدرسة</h1>
<p>الإصدار الشامل - الإدارة الذكية</p>

</div>
</div>

<div id="app">

<aside class="sidebar" id="sidebar">
<div class="brand">
<div class="brand-logo" id="sidebarLogo">و</div>
<h2 id="sidebarSchoolName">مدرستي</h2>

</div>

</div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"><div class="modal-head"><h3 id="modalTitle"></h3><div class="modal-close" onclick="UI.closeModal()">×</div></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>

<script>
/* ============================================================
   SCHOOL MANAGEMENT SYSTEM - UPGRADED VERSION
   ============================================================ */

if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.classList.add('dark');
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>{e.matches?document.documentElement.classList.add('dark'):document.documentElement.classList.remove('dark')});

const DB={
  set(k,v){ localStorage.setItem('school_db_'+k, JSON.stringify(v)); },
  get(k,d=null){
    const val = localStorage.getItem('school_db_'+k);
    if(val) { try { return JSON.parse(val); } catch(e) { return d; } }
    return d;
  },
  clear(){
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith('school_db_')) localStorage.removeItem(k);
    });
  }
};

const GRADES=['أول ابتدائي','ثاني ابتدائي','ثالث ابتدائي','رابع ابتدائي','خامس ابتدائي','سادس ابتدائي','أول متوسط','ثاني متوسط','ثالث متوسط','أول ثانوي','ثاني ثانوي','ثالث ثانوي'];
const SECTIONS=['أ','ب','ج','د','هـ','و'];
const VIOLATION_TYPES=['مخالفة سلوكية عامة','عنف أو إيذاء','تخريب ممتلكات','غش في الاختبارات','تنمر','إحضار ممنوعات','عدم الالتزام بالزي','سوء أدب مع المعلم','الهروب من المدرسة','استخدام الجوال','أخرى'];
const ACTIONS_LIST=['إنذار شفهي','إنذار كتابي','استدعاء ولي الأمر','حسم درجات السلوك','تعهد خطي','فصل مؤقت'];
const EXCELLENCE_TYPES=['مشاركة مميزة','تفوق دراسي','سلوك إيجابي','مساعدة الزملاء','أخرى'];
const COMM_TYPES=['اتصال هاتفي','رسالة نصية','زيارة للمدرسة','اجتماع','استدعاء'];

const NAV_ITEMS=[
  {type:'link', id:'dashboard',label:'لوحة التحكم',icon:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>'},
  {type:'header', label:'بيانات الطلاب'},
  {type:'link', id:'students',label:'إدارة الطلاب',icon:'<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>'},
  {type:'link', id:'excellence',label:'التميز والمكافآت',icon:'<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>'},
  {type:'link', id:'communications',label:'تواصل أولياء الأمور',icon:'<path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>'},

function downloadCSV(filename,headers,rows){
  let csv='\uFEFF'+headers.join(',')+'\n';
  rows.forEach(r=>{csv+=r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')+'\n'});
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

function drawBarChart(canvasId,labels,datasets){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width=canvas.parentElement.clientWidth-40; const H=canvas.height=220;
  const pad={t:20,r:20,b:40,l:50}; const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  const isDark=document.documentElement.classList.contains('dark');
  const txtColor=isDark?'#8b949e':'#4a5068', gridColor=isDark?'#30363d':'#e8ecf1';
  const allVals=datasets.flatMap(d=>d.data); const maxVal=Math.max(...allVals,1);
  const barGroupW=cw/labels.length; const barW=Math.min(barGroupW*0.6/datasets.length,40);
  ctx.strokeStyle=gridColor;ctx.lineWidth=.5;ctx.font='11px Cairo';ctx.fillStyle=txtColor;ctx.textAlign='left';
  for(let i=0;i<=4;i++){
    const y=pad.t+ch-ch*(i/4);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillText(Math.round(maxVal*i/4),4,y+4);
  }
  datasets.forEach((ds,di)=>{
    ctx.fillStyle=ds.color;
    ds.data.forEach((v,i)=>{
      const x=pad.l+barGroupW*i+(barGroupW-barW*datasets.length)/2+barW*di;
      const h=(v/maxVal)*ch; const y=pad.t+ch-h;
      ctx.beginPath();ctx.roundRect(x,y,barW-2,h,3);ctx.fill();
    });
  });
  ctx.fillStyle=txtColor;ctx.textAlign='center';ctx.font='11px Cairo';
  labels.forEach((l,i)=>{ctx.fillText(l,pad.l+barGroupW*i+barGroupW/2,H-8)});
}

function generateAIInsights(){
  let insights=[];
  const sts=getStudents(), abs=getRecords('absences'), vio=getRecords('violations');
  if(!sts.length) return `<p style="color:var(--text3);font-size:13px">لا توجد بيانات كافية للتحليل.</p>`;
  
  // 1. Most absent day
  const daysCount = {};
  abs.forEach(a => { const d = new Date(a.date).getDay(); daysCount[d] = (daysCount[d]||0) + 1; });
  let maxDay = -1, maxVal = 0;
  for(let d in daysCount) { if(daysCount[d] > maxVal) { maxVal=daysCount[d]; maxDay=d; } }
  const dayNames = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  if(maxVal > 2) insights.push({type:'info', text:`💡 <strong>تحليل الغياب:</strong> يوم ${dayNames[maxDay]} هو الأكثر غياباً بشكل عام (${maxVal} حالة).`});

  // 2. Class with most violations
  const classVio = {};
  vio.forEach(v => {
    const s = sts.find(x => x.id === v.studentId);
    if(s) { const c = s.grade+'/'+s.section; classVio[c] = (classVio[c]||0) + 1; }
  });
  let maxClass = '', maxCVal = 0;
  for(let c in classVio) { if(classVio[c] > maxCVal) { maxCVal=classVio[c]; maxClass=c; } }
  if(maxCVal > 2) insights.push({type:'warn', text:`📊 <strong>تحليل السلوك:</strong> الفصل (${maxClass}) يحتاج لتدخل، لديه أعلى معدل مخالفات مسجلة.`});

  // 3. Automatic Alerts
  sts.forEach(s=>{
    let sAbs=abs.filter(a=>a.studentId===s.id).length;
    let sVio=vio.filter(v=>v.studentId===s.id).length;
    if(sAbs>=5) insights.push({type:'danger', text:`🚨 <strong>إنذار تلقائي:</strong> الطالب ${s.name} تجاوز 5 أيام غياب.`});
    if(sVio>=3) insights.push({type:'danger', text:`🚨 <strong>إنذار تلقائي:</strong> الطالب ${s.name} تكررت مخالفاته (${sVio} مرات).`});
  });

  if(!insights.length) return `<p style="color:var(--text3);font-size:13px">الأمور مستقرة، لا توجد تنبيهات حالية.</p>`;
  return insights.map(a=>`<div class="alert-box ${a.type}">${a.text}</div>`).join('');
}

function htmlProfile(sid){
  const s=findStudent(sid);if(!s)return'<div class="empty-state"><p>لم يتم العثور على الطالب</p></div>';
  const abs=getRecords('absences').filter(a=>a.studentId===sid), trd=getRecords('tardiness').filter(a=>a.studentId===sid);
  const prm=getRecords('permissions').filter(a=>a.studentId===sid), vio=getRecords('violations').filter(a=>a.studentId===sid);
  const exc=getRecords('excellence').filter(a=>a.studentId===sid), com=getRecords('communications').filter(a=>a.studentId===sid);
  const ref=getRecords('referrals').filter(a=>a.studentId===sid), cus=getRecords('custodies').filter(a=>a.studentId===sid), rol=getRecords('roles').filter(a=>a.studentId===sid);
  
  const healthBadge = s.healthNotes ? `<span class="badge badge-danger" style="margin-right:8px">🏥 حالة صحية</span>` : '';
  return `<div class="section active fade-in" id="sec-profile">
<button class="btn btn-outline" onclick="App.navigate('students')" style="margin-bottom:16px">→ رجوع</button>
<div class="profile-header"><div class="profile-photo">${s.photo?`<img src="${s.photo}">`:'<span>👤</span>'}</div>
<div class="profile-info"><h2>${escHtml(s.name)}${healthBadge}</h2>
<div class="meta"><span>🆔 ${escHtml(s.nationalId)}</span><span>📚 ${escHtml(s.grade)} / ${escHtml(s.section)}</span><span>📱 ${escHtml(s.parentPhone)}</span></div>
${s.notes?`<p style="margin-top:8px;font-size:13px;color:var(--text2)">${escHtml(s.notes)}</p>`:''}</div>
<div style="display:flex;gap:8px;align-self:center;flex-wrap:wrap;justify-content:center">
<button class="btn btn-success btn-sm" onclick="Reports.whatsappReport('${sid}')">💬 إرسال واتساب</button>
<button class="btn btn-accent btn-sm" onclick="Reports.studentReport('${sid}')">🖨️ التقرير الشامل</button>
</div></div>
<div class="profile-tabs">
<button class="active" onclick="Profile.tab(this,'pAbsence')">الغياب (${abs.length})</button>
<button onclick="Profile.tab(this,'pTardiness')">التأخر (${trd.length})</button>
<button onclick="Profile.tab(this,'pViolations')">المخالفات (${vio.length})</button>
<button onclick="Profile.tab(this,'pExcellence')">التميز (${exc.length})</button>
<button onclick="Profile.tab(this,'pComms')">التواصل (${com.length})</button>
<button onclick="Profile.tab(this,'pRef')">التحويلات (${ref.length})</button>
<button onclick="Profile.tab(this,'pCus')">العهد (${cus.length})</button>
<button onclick="Profile.tab(this,'pRol')">الأدوار (${rol.length})</button>
<button onclick="Profile.tab(this,'pHealth')">السجل الصحي</button>
</div>
<div class="profile-section active" id="pAbsence">${abs.length?`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>ملاحظات</th></tr></thead><tbody>${abs.map(a=>`<tr><td>${fmtDate(a.date)}</td><td><span class="badge ${a.type==='excused'?'badge-success':'badge-danger'}">${a.type==='excused'?'بعذر':'بدون عذر'}</span></td><td>${escHtml(a.notes)}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state"><p>لا يوجد غياب</p></div>'}</div>
<div class="profile-section" id="pTardiness">${trd.length?`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>الدخول</th><th>الدقائق</th></tr></thead><tbody>${trd.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${escHtml(a.arrivalTime)}</td><td>${a.minutes}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state"><p>لا يوجد تأخر</p></div>'}</div>
<div class="profile-section" id="pViolations">${vio.length?`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الإجراء</th></tr></thead><tbody>${vio.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${escHtml(a.type)}</td><td>${escHtml(a.action)}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state"><p>لا يوجد مخالفات</p></div>'}</div>
<div class="profile-section" id="pExcellence">${exc.length?`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>ملاحظات</th></tr></thead><tbody>${exc.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${escHtml(a.type)}</td><td>${escHtml(a.notes)}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state"><p>لا يوجد سجل تميز</p></div>'}</div>
<div class="profile-section" id="pComms">${com.length?`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>النتيجة</th></tr></thead><tbody>${com.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${escHtml(a.type)}</td><td>${escHtml(a.result)}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state"><p>لا يوجد تواصل مسجل</p></div>'}</div>

<div class="profile-section" id="pRef"><button class="btn btn-sm btn-primary" style="margin-bottom:10px" onclick="Profile.addRef('${sid}')">+ إضافة تحويل</button>${ref.length?`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>الجهة</th><th>السبب</th><th>حذف</th></tr></thead><tbody>${ref.map(a=>`<tr><td>${fmtDate(a.date)}</td><td><span class="badge badge-info">${escHtml(a.dest)}</span></td><td>${escHtml(a.reason)}</td><td><button class="btn-icon" onclick="GenericCRUD('referrals').remove('${a.id}');setTimeout(()=>App.openProfile('${sid}'),100)">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state"><p>لا توجد تحويلات</p></div>'}</div>

<div class="profile-section" id="pCus"><button class="btn btn-sm btn-primary" style="margin-bottom:10px" onclick="Profile.addCus('${sid}')">+ إضافة عهدة</button>${cus.length?`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>الغرض</th><th>الحالة</th><th>حذف</th></tr></thead><tbody>${cus.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${escHtml(a.item)}</td><td><span class="badge ${a.status==='مستلمة'?'badge-success':a.status==='مفقودة'?'badge-danger':'badge-warning'}" style="cursor:pointer" onclick="Profile.toggleCus('${a.id}','${sid}')">${escHtml(a.status)}</span></td><td><button class="btn-icon" onclick="GenericCRUD('custodies').remove('${a.id}');setTimeout(()=>App.openProfile('${sid}'),100)">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state"><p>لا توجد عهد</p></div>'}</div>

<div class="profile-section" id="pRol"><button class="btn btn-sm btn-primary" style="margin-bottom:10px" onclick="Profile.addRol('${sid}')">+ إضافة دور</button>${rol.length?`<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>الدور/المهمة</th><th>حذف</th></tr></thead><tbody>${rol.map(a=>`<tr><td>${fmtDate(a.date)}</td><td><span class="badge badge-primary">${escHtml(a.role)}</span></td><td><button class="btn-icon" onclick="GenericCRUD('roles').remove('${a.id}');setTimeout(()=>App.openProfile('${sid}'),100)">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state"><p>لا توجد أدوار مسجلة</p></div>'}</div>

<div class="profile-section" id="pHealth"><div class="panel" style="padding:20px"><h3>السجل الصحي للطوارئ</h3><textarea id="pHealthNotes" rows="4" placeholder="حساسية، أمراض مزمنة، أدوية...">${escHtml(s.healthNotes||'')}</textarea><button class="btn btn-primary" style="margin-top:10px" onclick="Profile.saveHealth('${sid}')">حفظ السجل الصحي</button></div></div>
</div>`;
}

/* ---- MODULES LOGIC ---- */
const Students={
  _filter:{search:'',grade:'',section:''},
  render(){
    let list=getStudents(); const f=this._filter;
    if(f.search){const q=f.search.toLowerCase();list=list.filter(s=>s.name.toLowerCase().includes(q)||s.nationalId.includes(q))}
    if(f.grade)list=list.filter(s=>s.grade===f.grade);
    if(f.section)list=list.filter(s=>s.section===f.section);
    const tb=document.getElementById('studentsTable');if(!tb)return;
    if(!list.length){tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text3)">لا يوجد طلاب</td></tr>';return}
    tb.innerHTML=list.map((s,i)=>`<tr><td>${i+1}</td>
<td><a href="#" onclick="App.openProfile('${s.id}');return false" style="font-weight:600">${escHtml(s.name)}</a></td>

const GenericCRUD = (name, title, fields, renderRow, moduleName) => ({
  render(){
    const list=getRecords(name).sort((a,b)=>(b.date && a.date) ? b.date.localeCompare(a.date) : 0);
    const tb=document.getElementById(`${name}Table`);if(!tb)return;
    if(!list.length){tb.innerHTML=`<tr><td colspan="10" style="text-align:center;padding:30px;color:var(--text3)">لا يوجد سجلات</td></tr>`;return}
    tb.innerHTML=list.map((a,i)=>renderRow(a,i)).join('');
  },
  openAdd(){
    const html=fields.map(f=>`<div class="form-group ${f.full?'full':''}"><label>${f.label}</label>${typeof f.html==='function'?f.html():f.html}</div>`).join('');
    UI.openModal(`إضافة ${title}`,`<div class="form-grid">${html}</div>`,`<button class="btn btn-primary" onclick="${moduleName}.save()">حفظ</button><button class="btn btn-outline" onclick="UI.closeModal()">إلغاء</button>`);
  },
  save(customObj=null){
    const obj = customObj || {id:uid(), createdAt:today()};
    if(!customObj){
      for(let f of fields){
        const el=document.getElementById(f.id);
        if(f.req&&(!el||!el.value)){UI.toast('أكمل الحقول','danger');return}
        const propName = f.id.substring(f.id.indexOf('_') + 1);
        if(el) obj[propName] = el.type==='radio' ? document.querySelector(`input[name="${el.name}"]:checked`)?.value : el.value;
      }
    }
    const arr=getRecords(name); arr.push(obj); saveRecords(name,arr);
    UI.closeModal(); 
    if(this.render) this.render();
    UI.toast('تم الحفظ');
  },
  remove(id){
    UI.confirm('حذف السجل؟',()=>{
      saveRecords(name,getRecords(name).filter(a=>a.id!==id)); 
      if(this.render) this.render();
      UI.toast('تم الحذف');
    });
  }
});

  ...GenericCRUD('tardiness','تأخر',[
    {full:true, label:'الطالب *', req:true, id:'t_studentId', html:()=>`<select id="t_studentId"><option value="">اختر</option>${UI.studentSelect()}</select>`},
    {label:'التاريخ *', req:true, id:'t_date', html:()=>`<input type="date" id="t_date" value="${today()}">`},
    {label:'وقت الدخول', req:true, id:'t_arrivalTime', html:()=>`<input type="time" id="t_arrivalTime" onchange="Tardiness.calcMins(this.value)">`},
    {label:'الدقائق', req:true, id:'t_minutes', html:()=>`<input type="number" id="t_minutes" min="0">`}
  ], (a,i)=>`<tr><td>${i+1}</td><td>${escHtml(studentName(a.studentId))}</td><td>${fmtDate(a.date)}</td><td>${a.arrivalTime}</td><td>${a.minutes}</td><td><button class="btn-icon" onclick="Tardiness.remove('${a.id}')">🗑️</button></td></tr>`, 'Tardiness'),
  calcMins(timeStr){
    if(!timeStr) return;
    const start = getSettings().schoolStartTime || '07:00';
    const [sH, sM] = start.split(':').map(Number);
    const [eH, eM] = timeStr.split(':').map(Number);
    let diff = (eH * 60 + eM) - (sH * 60 + sM);
    document.getElementById('t_minutes').value = diff > 0 ? diff : 0;
  }
};

const Tools = {
  generateSMS(){
    const g=document.getElementById('smsGrade').value, s=document.getElementById('smsSection').value;
    const msg=document.getElementById('smsText').value.trim();
    if(!msg){UI.toast('اكتب نص الرسالة','danger');return;}
    let sts=getStudents();
    if(g) sts=sts.filter(x=>x.grade===g); if(s) sts=sts.filter(x=>x.section===s);
    sts=sts.filter(x=>x.parentPhone);
    const res=document.getElementById('smsResult'), list=document.getElementById('smsList');
    res.style.display='block';
    if(!sts.length){list.innerHTML='<p>لا توجد أرقام هواتف مطابقة.</p>';return}
    list.innerHTML=sts.map(st=>`<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)">
      <strong style="color:var(--primary)">${escHtml(st.name)} (${escHtml(st.parentPhone)})</strong>
      <p style="font-size:12px;margin-top:4px">${escHtml(msg)}</p>
    </div>`).join('');
    const copyTxt=sts.map(st=>`${st.parentPhone}\n${msg}`).join('\n\n');
    list.innerHTML += `<button class="btn btn-success" onclick="navigator.clipboard.writeText(\`${copyTxt}\`);UI.toast('تم نسخ جميع الرسائل')">📋 نسخ جميع الأرقام والرسائل</button>`;
  }
};

const Reports = {
  studentReport(paramId){
    const sid=paramId || document.getElementById('rptStudent')?.value;
    if(!sid){UI.toast('اختر طالب','danger');return}
    const s=findStudent(sid);if(!s)return;
    const abs=getRecords('absences').filter(a=>a.studentId===sid), trd=getRecords('tardiness').filter(a=>a.studentId===sid);
    const vio=getRecords('violations').filter(a=>a.studentId===sid), exc=getRecords('excellence').filter(a=>a.studentId===sid);
    let h=`<h2>بطاقة السلوك والتميز للطالب: ${escHtml(s.name)}</h2>
<div class="info-row"><span><strong>الهوية:</strong> ${escHtml(s.nationalId)}</span><span><strong>الصف:</strong> ${escHtml(s.grade)}/${escHtml(s.section)}</span></div>`;
    h+=`<h2>التميز والمكافآت (${exc.length})</h2>`;
    if(exc.length)h+=`<table><thead><tr><th>التاريخ</th><th>النوع</th><th>ملاحظات</th></tr></thead><tbody>${exc.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${escHtml(a.type)}</td><td>${escHtml(a.notes)}</td></tr>`).join('')}</tbody></table>`; else h+='<p>لا يوجد</p>';
    h+=`<h2>الغياب والتأخر</h2><p>عدد أيام الغياب: <strong>${abs.length}</strong> | مرات التأخر: <strong>${trd.length}</strong></p>`;
    h+=`<h2>المخالفات السلوكية (${vio.length})</h2>`;
    if(vio.length)h+=`<table><thead><tr><th>التاريخ</th><th>النوع</th><th>الإجراء المتخذ</th></tr></thead><tbody>${vio.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${escHtml(a.type)}</td><td>${escHtml(a.action)}</td></tr>`).join('')}</tbody></table>`; else h+='<p>سلوك مثالي، لا يوجد مخالفات</p>';
    if(s.notes||s.healthNotes) h+=`<h2>ملاحظات الوكيل والوضع الصحي</h2><p>${escHtml(s.notes)}</p><p style="color:red">${escHtml(s.healthNotes)}</p>`;
    openPrint('بطاقة الطالب الشاملة',h);
  },
  violationsReport(){
    const from=document.getElementById('rptVioFrom').value, to=document.getElementById('rptVioTo').value;
    let list=getRecords('violations').sort((a,b)=>b.date.localeCompare(a.date));
    if(from)list=list.filter(v=>v.date>=from); if(to)list=list.filter(v=>v.date<=to);
    let h=`<h2>تقرير المخالفات${from?' من '+fmtDate(from):''}${to?' إلى '+fmtDate(to):''}</h2>`;
    if(list.length)h+=`<table><thead><tr><th>الطالب</th><th>التاريخ</th><th>النوع</th><th>الإجراء</th></tr></thead><tbody>${list.map(a=>`<tr><td>${escHtml(studentName(a.studentId))}</td><td>${fmtDate(a.date)}</td><td>${escHtml(a.type)}</td><td>${escHtml(a.action)}</td></tr>`).join('')}</tbody></table>`;
    else h+='<p>لا يوجد مخالفات</p>';
    openPrint('تقرير مخالفات',h);
  },
  whatsappReport(sid){
    const s = findStudent(sid);
    if(!s) return;
    
    UI.openModal('إرسال تقرير عبر الواتساب', `
      <div class="form-grid">
        <div class="form-group full">
          <label>رقم هاتف ولي الأمر (للمراسلة)</label>
          <input type="text" id="waPhoneInput" value="${escHtml(s.parentPhone || '')}" placeholder="مثال: 05XXXXXXXX أو 9665XXXXXXXX" style="direction:ltr; text-align:right;">
          <p style="font-size:11px; color:var(--text3); margin-top:4px;">تأكد من صحة الرقم. سيتم إضافة مفتاح الدولة تلقائياً إذا كان يبدأ بـ 05.</p>
        </div>
      </div>
    `, `<button class="btn btn-success" onclick="Reports.executeWhatsapp('${sid}')">إرسال 💬</button><button class="btn btn-outline" onclick="UI.closeModal()">إلغاء</button>`);
  },
  executeWhatsapp(sid){
    const s = findStudent(sid);
    if(!s) return;
    
    const phoneInput = document.getElementById('waPhoneInput').value.trim();
    if(!phoneInput) { UI.toast('يرجى إدخال رقم الهاتف أولاً', 'danger'); return; }

    let phone = phoneInput.replace(/\D/g, '');
    // تهيئة الرقم ليناسب كود السعودية إذا كان يبدأ بـ 05
    if (phone.startsWith('05')) phone = '966' + phone.substring(1);

    const abs = getRecords('absences').filter(a => a.studentId === sid).length;
    const trd = getRecords('tardiness').filter(a => a.studentId === sid).length;
    const prm = getRecords('permissions').filter(a => a.studentId === sid).length;
    const vio = getRecords('violations').filter(a => a.studentId === sid).length;
    const exc = getRecords('excellence').filter(a => a.studentId === sid).length;
    const schoolName = getSettings().schoolName || 'مدرستي';

    let msg = `🏫 *${schoolName}*\n\n`;
    msg += `*تقرير متابعة الطالب:* ${s.name}\n`;
    msg += `*الصف:* ${s.grade} / ${s.section}\n`;
    msg += `────────────────\n`;
    msg += `📊 *ملخص السجل:*\n`;
    msg += `▪️ أيام الغياب: ${abs}\n`;
    msg += `▪️ مرات التأخر: ${trd}\n`;
    msg += `▪️ الاستئذان: ${prm}\n`;
    msg += `▪️ المخالفات السلوكية: ${vio}\n`;
    msg += `▪️ التميز والمكافآت: ${exc}\n\n`;

    if (s.agentNotes) {
      msg += `📝 *ملاحظات الإدارة:*\n${s.agentNotes}\n\n`;
    }

    msg += `نأمل منكم متابعة الطالب، ومشاركتنا في دعمه للوصول إلى أفضل مستوى.\n`;
    msg += `مع تحيات،\n*وكيل شؤون الطلاب*`;

    const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
    UI.closeModal();
  }
};

const Settings={
  _logoBase64:'',
  uploadLogo(input){ if(input.files[0])UI.fileToBase64(input.files[0],b64=>{this._logoBase64=b64;UI.toast('تم رفع الشعار')}); },
  save(){
    const s=getSettings();
    s.schoolName=document.getElementById('setSchool').value.trim()||'مدرستي';
    s.academicYear=document.getElementById('setYear').value.trim()||'١٤٤٦ - ١٤٤٧ هـ';
    s.password=document.getElementById('setPass').value.trim()||'admin';
    s.schoolStartTime=document.getElementById('setStartTime').value||'07:00';
    if(this._logoBase64)s.schoolLogo=this._logoBase64;
    saveSettings(s); document.getElementById('sidebarSchoolName').textContent=s.schoolName; document.getElementById('sidebarYear').textContent=s.academicYear;
    if(s.schoolLogo) document.getElementById('sidebarLogo').innerHTML = `<img src="${s.schoolLogo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    UI.toast('تم حفظ الإعدادات');
  },
  exportJSON(){
    const keys = ['students','absences','tardiness','permissions','violations','excellence','communications','assembly','inspections','duties','calendar','substitutes','teacherLeaves','maintenance','visitors','lostfound','referrals','custodies','roles'];
    let data = {settings:getSettings()};
    keys.forEach(k=> data[k] = getRecords(k));
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='school_backup_'+today()+'.json';a.click();
    UI.toast('تم التصدير');
  },
  importJSON(input){
    const file=input.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        const keys = ['students','absences','tardiness','permissions','violations','excellence','communications','assembly','inspections','duties','calendar','substitutes','teacherLeaves','maintenance','visitors','lostfound','referrals','custodies','roles'];
        keys.forEach(k=>{if(data[k])saveRecords(k,data[k])});
        if(data.settings)saveSettings(data.settings);
        UI.toast('تم الاستعادة بنجاح'); setTimeout(()=>location.reload(), 1000);
      }catch(err){UI.toast('ملف غير صالح','danger')}
    };
    r.readAsText(file);
  },
  importTxt(){
    const grade=document.getElementById('importTxtGrade').value;
    const section=document.getElementById('importTxtSection').value;
    const fileInput=document.getElementById('importTxtFile');
    const file=fileInput.files[0];
    if(!grade||!section){UI.toast('يرجى اختيار الصف والشعبة','danger');return}
    if(!file){UI.toast('يرجى اختيار ملف TXT','danger');return}
    const reader=new FileReader();
    reader.onload=e=>{
      const text=e.target.result;
      const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
      if(!lines.length){UI.toast('الملف فارغ أو لا يحتوي على أسماء','danger');return}
      const arr=getStudents();
      let added=0;
      lines.forEach(name=>{
        arr.push({id:uid(),name,nationalId:'',grade,section,parentPhone:'',healthNotes:'',photo:'',notes:'',createdAt:today()});
        added++;
      });
      saveStudents(arr);
      fileInput.value='';
      UI.toast('تم استيراد '+added+' طالب بنجاح');
    };
    reader.readAsText(file,'UTF-8');
  },
  resetData(){UI.confirm('⚠️ حذف جميع البيانات؟',()=>{DB.clear();UI.toast('تم إعادة التعيين');setTimeout(()=>location.reload(),1000)})}
};

const Profile={
  tab(btn,id){
    btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    document.querySelectorAll('.profile-section').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active');
  },
  saveHealth(sid){
    const arr=getStudents();const idx=arr.findIndex(s=>s.id===sid);if(idx<0)return;
    arr[idx].healthNotes=document.getElementById('pHealthNotes').value; saveStudents(arr); UI.toast('تم حفظ السجل الصحي');
  },
  addRef(sid){
    UI.openModal('تحويل جديد',`<div class="form-grid"><div class="form-group"><label>الجهة</label><select id="rf_dest"><option>المرشد الطلابي</option><option>الموجه الصحي (العيادة)</option></select></div><div class="form-group full"><label>السبب</label><input id="rf_reason"></div></div>`,`<button class="btn btn-primary" onclick="GenericCRUD('referrals').save({id:uid(),studentId:'${sid}',date:today(),dest:document.getElementById('rf_dest').value,reason:document.getElementById('rf_reason').value});setTimeout(()=>App.openProfile('${sid}'),100)">حفظ</button>`);
  },
  addCus(sid){
    UI.openModal('إضافة عهدة',`<div class="form-grid"><div class="form-group full"><label>الغرض (كتاب، جهاز...)</label><input id="cs_item"></div></div>`,`<button class="btn btn-primary" onclick="GenericCRUD('custodies').save({id:uid(),studentId:'${sid}',date:today(),item:document.getElementById('cs_item').value,status:'مستلمة'});setTimeout(()=>App.openProfile('${sid}'),100)">حفظ</button>`);
  },
  toggleCus(id, sid){
    let arr = getRecords('custodies'); let item = arr.find(x => x.id === id);
    if(item.status === 'مستلمة') item.status = 'مسترجعة';
    else if(item.status === 'مسترجعة') item.status = 'مفقودة';
    else item.status = 'مستلمة';
    saveRecords('custodies', arr); App.openProfile(sid); Profile.tab(document.querySelector('button[onclick*="pCus"]'), 'pCus');
  },
  addRol(sid){
    UI.openModal('إضافة دور قيادي',`<div class="form-grid"><div class="form-group full"><label>الدور الموكل للطالب</label><select id="rl_role"><option>عريف الفصل</option><option>عضو الإذاعة المدرسية</option><option>رئيس النظام</option><option>مساعد معلم</option></select></div></div>`,`<button class="btn btn-primary" onclick="GenericCRUD('roles').save({id:uid(),studentId:'${sid}',date:today(),role:document.getElementById('rl_role').value});setTimeout(()=>App.openProfile('${sid}'),100)">حفظ</button>`);
  }
};

const App={
  _currentSection:'dashboard', _loggedIn:false,
  init(){
    const s=getSettings();
    document.getElementById('sidebarSchoolName').textContent=s.schoolName; document.getElementById('sidebarYear').textContent=s.academicYear;
    if(s.schoolLogo) document.getElementById('sidebarLogo').innerHTML = `<img src="${s.schoolLogo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    this.buildNav(); this.setDate();
    document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')this.login()});
  },
  buildNav(){
    const nav=document.getElementById('navLinks');
    nav.innerHTML=NAV_ITEMS.map(n=>{
      if(n.type==='header') return `<div class="nav-header">${n.label}</div>`;
      return `<a href="#" data-section="${n.id}" onclick="App.navigate('${n.id}');return false"><svg viewBox="0 0 24 24">${n.icon}</svg>${n.label}</a>`;
    }).join('');
  },
  setDate(){
    const d=new Date(); const opts={weekday:'long',year:'numeric',month:'long',day:'numeric'};
    document.getElementById('headerDate').textContent=d.toLocaleDateString('ar-SA',opts);
  },
  login(){
    const pass=document.getElementById('loginPass').value, s=getSettings();
    if(pass===(s.password||'admin')){
      this._loggedIn=true; document.getElementById('loginScreen').style.display='none'; document.getElementById('app').style.display='block'; this.navigate('dashboard');
    }else document.getElementById('loginErr').style.display='block';
  },
  logout(){
    this._loggedIn=false; document.getElementById('app').style.display='none'; document.getElementById('loginScreen').style.display='flex'; document.getElementById('loginPass').value=''; document.getElementById('loginErr').style.display='none';
  },
  navigate(section){
    this._currentSection=section; const mc=document.getElementById('mainContent');
    const titleObj=NAV_ITEMS.find(n=>n.id===section); document.getElementById('headerTitle').textContent=titleObj?titleObj.label:'';
    document.querySelectorAll('#navLinks a').forEach(a=>a.classList.toggle('active',a.dataset.section===section));
    switch(section){
      case'dashboard':mc.innerHTML=htmlDashboard();this.renderCharts();break;
      case'students':mc.innerHTML=htmlStudents();Students.render();break;
      case'absence':mc.innerHTML=htmlAbsence();Absence.render();break;
      case'tardiness':mc.innerHTML=htmlTardiness();Tardiness.render();break;
      case'permissions':mc.innerHTML=htmlPermissions();Permissions.render();break;
      case'violations':mc.innerHTML=htmlViolations();Violations.render();break;
      case'excellence':mc.innerHTML=htmlExcellence();Excellence.render();break;
      case'communications':mc.innerHTML=htmlCommunications();Communications.render();break;
      case'substitutes':mc.innerHTML=htmlSubstitutes();SubstituteClasses.render();break;
      case'teacherLeaves':mc.innerHTML=htmlTeacherLeaves();TeacherLeaves.render();break;
      case'assembly':mc.innerHTML=htmlAssembly();Assembly.render();break;
      case'inspections':mc.innerHTML=htmlInspections();Inspections.render();break;
      case'duties':mc.innerHTML=htmlDuties();Duties.render();break;
      case'maintenance':mc.innerHTML=htmlMaintenance();Maintenance.render();break;
      case'visitors':mc.innerHTML=htmlVisitors();Visitors.render();break;
      case'lostfound':mc.innerHTML=htmlLostFound();LostFound.render();break;
      case'calendar':mc.innerHTML=htmlCalendar();Calendar.render();break;
      case'bulksms':mc.innerHTML=htmlBulkSMS();break;
      case'formsmaker':mc.innerHTML=htmlFormsMaker();break;
      case'reports':mc.innerHTML=htmlReports();break;
      case'settings':mc.innerHTML=htmlSettings();break;
    }
    this.closeSidebar();
  },
  openProfile(sid){
    this._currentSection='profile'; document.getElementById('mainContent').innerHTML=htmlProfile(sid); document.getElementById('headerTitle').textContent='ملف الطالب'; document.querySelectorAll('#navLinks a').forEach(a=>a.classList.remove('active'));
  },
  toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('show');},
  closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show');},
  renderCharts(){
    setTimeout(()=>{
      const canvasWeek = document.getElementById('weekChart');
      if(!canvasWeek) return; // Prevent errors if user navigated away fast
      const days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'];
      const abs=getRecords('absences'), trd=getRecords('tardiness');
      const now=new Date(); const dayOfWeek=now.getDay();
      const absData=days.map((_,i)=>{const d=new Date(now);d.setDate(d.getDate()-(dayOfWeek-i));return abs.filter(a=>a.date===d.toISOString().slice(0,10)).length;});
      const trdData=days.map((_,i)=>{const d=new Date(now);d.setDate(d.getDate()-(dayOfWeek-i));return trd.filter(a=>a.date===d.toISOString().slice(0,10)).length;});
      drawBarChart('weekChart',days,[{data:absData,color:'#c41e3a'},{data:trdData,color:'#d4a017'}]);

      const sts=getStudents();
      const gradeAbs=GRADES.map(g=>{
        const gSts=sts.filter(s=>s.grade===g).map(s=>s.id);
        return abs.filter(a=>gSts.includes(a.studentId)).length;
      });
      drawBarChart('gradeCompChart',GRADES.map(g=>g.replace(' ابتدائي','').replace(' متوسط','').replace(' ثانوي','')),[{data:gradeAbs,color:'#0f2557'}]);
    },100);
  }
};

App.init();

/* ============================================================
   PWA SETUP (SINGLE-FILE PROGRESSIVE WEB APP)
   ============================================================ */
// 1. تحديد الأيقونة: نستخدم الشعار المرفوع في الإعدادات، أو أيقونة افتراضية
const pwaSettings = getSettings();
let finalIcon = '';
let iconType = 'image/svg+xml';

if (pwaSettings.schoolLogo) {
  // إذا قمت برفع شعار في الإعدادات، سيتم استخدامه كأيقونة للتطبيق
  finalIcon = pwaSettings.schoolLogo; 
  iconType = finalIcon.substring(5, finalIcon.indexOf(';')); // استخراج نوع الصورة تلقائياً (png/jpeg)
} else {
  // الأيقونة الافتراضية في حال لم ترفع شعاراً
  const iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><rect width="512" height="512" fill="#0f2557" rx="112"/><path d="M256 120L48 232l208 112 208-112L256 120zm0 168l-144-80v160c0 44.18 64.48 80 144 80s144-35.82 144-80V208l-144 80z" fill="#c9a227"/></svg>`;
  finalIcon = 'data:image/svg+xml;base64,' + btoa(iconSVG);
}

// 2. توليد ملف Web App Manifest برمجياً
const manifest = {
  name: pwaSettings.schoolName || "المساعد لوكيل المدرسة المطور",
  short_name: "وكيل المدرسة",
  start_url: location.href.split('?')[0],
  display: "standalone",
  background_color: "#eef1f6",
  theme_color: "#0f2557",
  description: "نظام شامل وذكي لإدارة مهام وكيل المدرسة.",
  icons: [
    { src: finalIcon, sizes: "192x192", type: iconType, purpose: "any maskable" },
    { src: finalIcon, sizes: "512x512", type: iconType, purpose: "any maskable" }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
const manifestURL = URL.createObjectURL(manifestBlob);
document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestURL}">`);

// 3. توليد وتسجيل Service Worker برمجياً
const swCode = `
  const CACHE_NAME = 'school-agent-pwa-v1';
  self.addEventListener('install', e => self.skipWaiting());
  self.addEventListener('activate', e => self.clients.claim());
  self.addEventListener('fetch', e => {
    e.respondWith(fetch(e.request).catch(() => new Response('التطبيق يعمل في وضع عدم الاتصال (Offline)')));
  });
`;
const swBlob = new Blob([swCode], {type: 'application/javascript'});
const swURL = URL.createObjectURL(swBlob);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register(swURL)
      .then(reg => console.log('✅ PWA Service Worker Registered!'))
      .catch(err => console.log('❌ PWA SW Registration Failed:', err));
  });
}
</script>
