name: Build VideoSRT v1.1 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'videosrt-build/**'
      - '.github/workflows/videosrt-v110-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Restore VideoSRT project
        run: |
          rm -rf generated-videosrt
          mkdir -p generated-videosrt
          cat videosrt-build/project.part*.b64 | base64 --decode > /tmp/VideoSRT-v1.1-source.zip
          unzip -t /tmp/VideoSRT-v1.1-source.zip
          unzip -q /tmp/VideoSRT-v1.1-source.zip -d generated-videosrt
          test -f generated-videosrt/VideoSRT/gradlew
          chmod +x generated-videosrt/VideoSRT/gradlew

      - name: Build debug APK
        working-directory: generated-videosrt/VideoSRT
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="generated-videosrt/VideoSRT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee VideoSRT-v1.1.0-SHA256.txt
          cp "$APK" VideoSRT-v1.1.0-debug.apk
          ls -lh VideoSRT-v1.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoSRT-v1.1.0-debug
          path: |
            VideoSRT-v1.1.0-debug.apk
            VideoSRT-v1.1.0-SHA256.txt
          if-no-files-found: error
          retention-days: 7
